<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color scheme switcher</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');

        body {
            background-color: antiquewhite;
            font-size: 15px;
            font-family: "Kanit", serif;
            font-weight: 100;
            font-style: normal;
        }
        .canvas{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1{
            /* display: flex; */
            /* justify-content: center; */
            align-self:  center;
        }
        h2{
            align-self:  center;
   
        }
        .canvas .button{
            padding: 10px 30px;
            width: 50px;
            height: 50px;
            border: 2px solid black;
            align-self: center;
            display: inline-block;
            justify-content: center;
            align-items: center;
            cursor: pointer;

        }
        
        #gray{
            background-color: gray;
        }
        #white{
            background-color: white;
        }
        #blueviolet{
            background-color: blueviolet;
        }
        #yellow{
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div class="canvas">
    <h1>Color scheme switcher</h1>
    <span class="button" id="gray"></span>
    <span class="button" id="white"></span>
    <span class="button" id="blueviolet"></span>
    <span class="button" id="yellow"></span>
    <h2>Try clicking on one of the colors above <span>
         to change the background color if this page!</span>
    </h2>
</div>
    <script src="script.js"></script>
</body>

</html>
