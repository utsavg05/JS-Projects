<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name " spellcheck="false">
            <button><img height="50" src="https://static.thenounproject.com/png/2946467-200.png" alt=""></button>
        </div>

        <div class="error">
            <p>Invalid city name </p>
        </div>

        <div class="weather">
            <img src="https://uxwing.com/wp-content/themes/uxwing/download/weather/weather-icon.png" class="weather-icon" width="140">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New York </h2>
            <div class="details">
                <div class="col">
                    <img width="140" src="https://static-00.iconduck.com/assets.00/humidity-icon-2048x1675-xxsge5os.png" alt="">
                    <p class="humidity">50% </p>
                    <p>Humidity </p>
                </div>

                    <div class="col">
                        <img width="140" src="https://cdn-icons-png.flaticon.com/512/3731/3731279.png" alt="">
                        <p class="wind">15Km/hr </p>
                        <p>Wind </p>
                    </div>

                </div>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
